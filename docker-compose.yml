version: '3.8'

services:
  # Relational Database for Access Security Auditing
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_security_node
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_password_2026
      POSTGRES_DB: ev_fleet_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Upgraded NoSQL Document Database (Production LTS Version)
  mongo-db:
    image: mongo:7.0
    container_name: mongo_logs_node
    ports:
      - "27017:27017"

  # Node.js Front-Facing API Gateway Layer (LTS Node)
  ingestion-gateway:
    build: ./ingestion-service
    container_name: node_ingestion_gateway
    ports:
      - "3000:3000"
    depends_on:
      - postgres-db

  # Python Analytics Processing Cluster Node (Internal Mesh Only)
  analytics-processor:
    build: ./analytics-service
    container_name: python_analytics_processor
    depends_on:
      - mongo-db

  # Containerized Autonomous Telemetry Simulator Loop
  vehicle-simulator:
    build: ./simulator
    container_name: ev_client_simulator
    depends_on:
      - ingestion-gateway
